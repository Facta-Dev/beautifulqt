name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - qt-best-practices (writing code)
        - qt-review (reviewing code)
        - qt-port (porting to Qt 6)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the Qt 6 documentation, the facta desktop handbook, the C++ Core Guidelines, the clang-tidy docs, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: cpp
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: cpp
